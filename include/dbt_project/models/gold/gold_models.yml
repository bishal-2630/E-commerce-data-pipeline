version: 2

models:
  - name: dim_customer
    description: One row per real customer (customer_unique_id), with latest city and state and order history.

  - name: dim_product
    description: One row per product, with English category, dimensions, volume and a weight class (light, medium, heavy).

  - name: dim_seller
    description: One row per seller, with city, state and map coordinates from the cleaned geo-location table.

  - name: dim_date
    description: Calendar table with one row per day from 2016-01-01 to 2018-12-31, with year, quarter, month, weekday and weekend flag.

  - name: fact_orders
    description: One row per order, with customer, delivery performance (days, delay, late flag), revenue, freight, payment total and review score.

  - name: fact_order_items
    description: One row per order item, with product, seller, customer, price, freight and item total.

  - name: agg_daily_sales
    description: Daily orders, revenue, freight and average order value. Excludes canceled and unavailable orders.

  - name: agg_monthly_revenue
    description: Monthly orders, customers, revenue and month-over-month growth percentage.

  - name: agg_delivery_performance
    description: Delivery days, on-time percentage and average review score per customer state, for delivered orders.

  - name: agg_product_category_performance
    description: Items sold, orders, revenue and average price per product category.
